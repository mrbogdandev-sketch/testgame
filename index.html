  ctx.moveTo(xL, y);
  for (let i = 0; i <= 40; i++){
    const px = xL + (w / 40) * i;
    const py = y + Math.sin(performance.now() * 0.005 + i * 0.5) * 10;
    ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawMonster(){
  if (!monster.active) return;
  if (monster.phase === 'warning') return;
  const px = monster.x, py = monster.y;
  ctx.fillStyle = '#c41010';
  ctx.beginPath(); ctx.arc(px, py, MONSTER_R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ff3838'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#3a0808';
  ctx.beginPath(); ctx.arc(px, py, MONSTER_R*0.55, 0, Math.PI*2); ctx.fill();
  const eyeAng = performance.now() * 0.004;
  ctx.fillStyle = '#ffdd44';
  ctx.beginPath(); ctx.arc(px + Math.cos(eyeAng)*7, py + Math.sin(eyeAng)*7, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#330000';
  ctx.beginPath(); ctx.arc(px + Math.cos(eyeAng)*7, py + Math.sin(eyeAng)*7, 2, 0, Math.PI*2); ctx.fill();
}
function drawChaser(){
  const c = orderState.chaser;
  if (!c.active || !c.room) return;
  if (player.y < c.room.yTop || player.y > c.room.yBottom) return;
  const isChasing = c.mode === 'chase';
  /* Отладочная визуализация: бесконечный сектор зрения и темная зона вне него. */
  const rayCount = 24;
  const leftAngle = c.angle - CHASER_FOV/2;
  const rightAngle = c.angle + CHASER_FOV/2;
  const visionPoints = [];
  for (let i = 0; i <= rayCount; i++){
    const angle = leftAngle + (CHASER_FOV * i / rayCount);
    const distance = visionDistanceAtAngle(c, c.room, angle);
    visionPoints.push({ x:c.x + Math.cos(angle)*distance, y:c.y + Math.sin(angle)*distance });
  }
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.beginPath(); ctx.arc(c.x, c.y, 2200, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = c.visible ? 'rgba(190,190,160,0.12)' : 'rgba(130,130,130,0.08)';
  ctx.beginPath(); ctx.moveTo(c.x, c.y);
  for (const point of visionPoints) ctx.lineTo(point.x, point.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c.visible ? 'rgba(220,220,180,0.55)' : 'rgba(150,150,150,0.35)';
  ctx.lineWidth = 2; ctx.setLineDash([12, 8]);
  ctx.beginPath(); ctx.moveTo(c.x, c.y);
  for (const point of visionPoints) ctx.lineTo(point.x, point.y);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  ctx.fillStyle = isChasing ? '#9b5f32' : '#80653a';
  ctx.beginPath(); ctx.arc(c.x, c.y, CHASER_R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = isChasing ? '#ffcc44' : '#ffaa55'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#1a0500';
  ctx.beginPath(); ctx.arc(c.x, c.y, CHASER_R*0.5, 0, Math.PI*2); ctx.fill();
  const eyeAng = performance.now() * 0.008;
  for (let i = 0; i < 3; i++){
    const a = eyeAng + i*(Math.PI*2/3);
    const ex = c.x + Math.cos(a)*9;
    const ey = c.y + Math.sin(a)*9;
    ctx.fillStyle = isChasing ? '#ff4444' : '#ffaa22';
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI*2); ctx.fill();
  }
}
function drawLight(px, py){
  /* Обычное мягкое круговое освещение без фонарика и привязки к курсору. */
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(0, 0, VW, VH);
  const radius = Math.max(420, Math.min(VW, VH) * 0.72);
  const light = ctx.createRadialGradient(px, py, 30, px, py, radius);
  light.addColorStop(0, 'rgba(255,255,255,0.10)');
  light.addColorStop(0.38, 'rgba(255,255,255,0.04)');
  light.addColorStop(0.72, 'rgba(0,0,0,0.28)');
  light.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = light;
  ctx.fillRect(0, 0, VW, VH);
}
function drawPlayer(px, py){
  if (textures.mainchar){
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(player.angle);
    const size = PLAYER_R * 2.8;
    drawSpriteFit(textures.mainchar, 0, 0, size);
    ctx.restore();
  } else return;
}
function drawEffects(){
  for (const e of effects){
    const k = e.t / e.dur;
    if (e.type === 'impact'){
      const r = e.maxR*k;
      ctx.strokeStyle = `rgba(255,220,120,${1-k})`;
      ctx.lineWidth = 4*(1-k)+1;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.stroke();
    }
  }
}
function drawBurnVignette(){
  const v = burnEvent.vignette;
  if (v <= 0.01) return;
  const grd = ctx.createLinearGradient(0, VH, 0, VH * 0.4);
  grd.addColorStop(0, `rgba(255,0,0,${v*0.8})`);
  grd.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
}
function drawCorridorVignette(){
  if (!corridorState.active) return;
  const distToChaser = player.y - corridorState.chaserY;
  const danger = clamp(1 - distToChaser / 700, 0, 1);
  if (danger <= 0.01) return;
  ctx.fillStyle = `rgba(0,0,0,${0.7 * danger})`;
  ctx.fillRect(0, VH * 0.5, VW, VH * 0.5);
}
function drawBurnHud(){
  if (!burnEvent.active) return;
  const t = BURN_DURATION - burnEvent.timer;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 40px ui-monospace, Consolas, monospace';
  ctx.fillStyle = t <= 8 ? '#ff2222' : '#ffaa55';
  ctx.fillText(Math.max(0, Math.ceil(t)) + ' с', VW/2, 130);
  ctx.restore();
}
function drawCorridorHud(){
  if (!corridorState.active) return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px ui-monospace, Consolas, monospace';
  ctx.fillStyle = '#ff5050';
  const txt = corridorState.roomsCreated >= CORRIDOR_COUNT
    ? 'ПОСЛЕДНИЙ КОРИДОР!'
    : 'КОРИДОРОВ ОСТАЛОСЬ: ' + (CORRIDOR_COUNT - corridorState.roomsCreated + 1);
  ctx.fillText(txt, VW/2, 128);
  ctx.restore();
}
function drawMonsterWarningBorder(){
  if (!monster.active || monster.phase !== 'warning') return;
  const t = performance.now() * 0.008;
  const alpha = 0.20 + 0.25 * Math.abs(Math.sin(t));
  ctx.fillStyle = `rgba(255,0,0,${alpha})`;
  const thick = 10;
  ctx.fillRect(0, 0, VW, thick);
  ctx.fillRect(0, VH - thick, VW, thick);
  ctx.fillRect(0, 0, thick, VH);
  ctx.fillRect(VW - thick, 0, thick, VH);
}
function drawDeathOverlay(){
  if (!dying) return;
  const t = Math.min(1, deathTimer/1.3);
  if (deathReason === 'burn'){
    ctx.fillStyle = `rgba(180,40,0,${t*0.9})`; ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.globalAlpha = Math.min(1, deathTimer*1.5); ctx.textAlign = 'center';
    ctx.font = 'bold 62px ui-monospace, Consolas, monospace';
    ctx.fillStyle = '#ff5522';
    ctx.fillText('СГОРЕЛ ЗАЖИВО', VW/2, VH/2);
    ctx.restore();
  } else if (deathReason === 'corridor'){
    ctx.fillStyle = `rgba(0,0,0,${t*0.95})`; ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.globalAlpha = Math.min(1, deathTimer*1.5); ctx.textAlign = 'center';
    ctx.font = 'bold 60px ui-monospace, Consolas, monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('ТЬМА ПОГЛОТИЛА', VW/2, VH/2);
    ctx.restore();
  } else {
    ctx.fillStyle = `rgba(110,0,0,${t*0.85})`; ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.globalAlpha = Math.min(1, deathTimer*1.5); ctx.textAlign = 'center';
    ctx.font = 'bold 64px ui-monospace, Consolas, monospace';
    ctx.fillStyle = '#ff3030';
    ctx.fillText('ОНО ТЕБЯ НАШЛО', VW/2, VH/2);
    ctx.restore();
  }
}
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#050507'; ctx.fillRect(0, 0, VW, VH);

  const sx = shakeIntensity > 0 ? (Math.random()*2-1) * shakeIntensity : 0;
  const sy = shakeIntensity > 0 ? (Math.random()*2-1) * shakeIntensity : 0;

  ctx.save();
  ctx.translate(VW/2-camera.x + sx, VH/2-camera.y + sy);
  const vL = camera.x-VW/2-340, vR = camera.x+VW/2+340;
  const vT = camera.y-VH/2-340, vB = camera.y+VH/2+340;
  for (const room of rooms){
    if (room.yTop > vB || room.yBottom < vT || room.xR < vL || room.xL > vR) continue;
    ctx.globalAlpha = room.alpha; drawRoom(room);
  }
  ctx.globalAlpha = 1;
  drawCorridorChaser();
  for (const room of rooms){
    if (room.alpha < 0.5) continue;
    if (room.yTop > vB || room.yBottom < vT) continue;
    ctx.globalAlpha = room.alpha;
    drawBoxes(room);
  }
  ctx.globalAlpha = 1;
  for (const room of rooms){
    if (room.alpha < 0.5) continue;
    drawPuzzleRoom(room);
    drawOrderRoom(room);
    if (room.kind === 'ticket' && ticketState.room === room) drawPC();
    for (const p of room.posters){
      if (p.state !== 'carried'){
        if (hoveredPoster === p){
          ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
          const hx = p.state === 'idle' ? p.x : p.dropX;
          const hy = p.state === 'idle' ? p.y : p.dropY;
          ctx.strokeRect(hx-4, hy-4, p.w+8, p.h+8); ctx.setLineDash([]);
        }
        const px = p.state === 'idle' ? p.x : p.dropX;
        const py = p.state === 'idle' ? p.y : p.dropY;
        ctx.globalAlpha = room.alpha;
        ctx.fillStyle = '#b8954a'; ctx.fillRect(px, py, p.w, p.h);
        ctx.strokeStyle = '#3a2a15'; ctx.lineWidth = 2;
        ctx.strokeRect(px+1, py+1, p.w-2, p.h-2);
      }
    }
  }
  ctx.globalAlpha = 1;
  drawMonster();
  drawChaser();
  drawPlayer(player.x, player.y);
  for (const room of rooms){
    for (const p of room.posters){
      if (p.state === 'carried'){
        const px = player.x-p.w/2, py = player.y-p.h/2;
        ctx.fillStyle = '#c9a55a'; ctx.fillRect(px, py, p.w, p.h);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(px, py, p.w, p.h);
      }
    }
  }
  drawHeldPiece();
  drawHeldPainting();
  drawLever();
  drawEffects();
  ctx.restore();

  const px = player.x-camera.x+VW/2;
  const py = player.y-camera.y+VH/2;
  drawLight(px, py);
  drawBurnVignette();
  drawCorridorVignette();
  drawMonsterWarningBorder();
  drawBurnHud();
  drawCorridorHud();
  drawDeathOverlay();
}

/* ══════════════ HUD ══════════════ */
const hRoom = document.getElementById('hRoom');
const hAlive = document.getElementById('hAlive');
const hTimer = document.getElementById('hTimer');
const clockEl = document.getElementById('clock');
const coinEl = document.getElementById('coinCount');
const floorBadge = document.getElementById('floorBadge');
const burnHudEl = document.getElementById('burnHud');
const chaseHudEl = document.getElementById('chaseHud');
const ticketInfoEl = document.getElementById('ticketInfo');
const noteEl = document.getElementById('note');
const noteBody = document.getElementById('noteBody');
let lastRoom = -1, lastAlive = -1, lastCoin = -1, lastFloor = -1;

function fmtTime(t){ const tt = Math.max(0, Math.ceil(t)); return Math.floor(tt/60) + ':' + String(tt%60).padStart(2,'0'); }
function fmtClock(h){
  const hh = Math.floor(h % 24);
  const mm = Math.floor((h % 1) * 60);
  return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function updateHud(){
  if (passedRoom !== lastRoom){ hRoom.textContent = passedRoom; lastRoom = passedRoom; }
  if (rooms.length !== lastAlive){ hAlive.textContent = rooms.length; lastAlive = rooms.length; }
  if (coinCount !== lastCoin){ coinEl.textContent = coinCount; lastCoin = coinCount; if (pcOpen) renderPC(); }
  if (currentFloor !== lastFloor){ floorBadge.textContent = 'ЭТАЖ ' + currentFloor; lastFloor = currentFloor; }
  clockEl.textContent = fmtClock(gameTimeHours);
  burnHudEl.style.display = burnEvent.active ? 'block' : 'none';

  if (corridorState.active && corridorState.bannerTimer < 3){
    chaseHudEl.style.display = 'block';
    const a = 1 - Math.max(0, (corridorState.bannerTimer - 2) / 1);
    chaseHudEl.style.opacity = a;
  } else chaseHudEl.style.display = 'none';

  if (ticketState.active && !ticketState.bought){
    const d = distanceToRect(player.x, player.y, ticketState.pcX, ticketState.pcY, ticketState.pcW, ticketState.pcH);
    if (d < PLAYER_R + PC_INTERACT_D + 80){
      ticketInfoEl.style.display = 'block';
      ticketInfoEl.textContent = 'ПОДОЙДИ И НАЖМИ НА ПК';
      ticketInfoEl.style.color = '#80c0ff';
    } else ticketInfoEl.style.display = 'none';
  } else ticketInfoEl.style.display = 'none';

  if (puzzleState.active && !puzzleState.solved){
    hTimer.textContent = fmtTime(puzzleState.timeLeft);
    hTimer.style.color = puzzleState.timeLeft < 15 ? '#ff2222' : '#ff8844';
    hTimer.style.display = 'inline';
    noteEl.style.display = 'none';
  } else if (orderState.active && !orderState.solved){
    hTimer.style.display = 'none';
    if (orderState.notePicked){
      noteEl.style.display = 'block';
      let html = '';
      for (let i = 0; i < orderState.sequence.length; i++){
        html += `<div class="row">Позиция ${i+1} <span>→ ${orderState.sequence[i]+1}</span></div>`;
      }
      noteBody.innerHTML = html;
    } else noteEl.style.display = 'none';
  } else {
    hTimer.style.display = 'none';
    noteEl.style.display = 'none';
  }
}

/* ══════════════ ГЛАВНЫЙ ЦИКЛ ══════════════ */
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;
  update(dt); draw(); updateHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
